    <main class="container">
    <fieldset>
    <legend><h1><strong>Зворотний зв'язок</strong></h1></legend>
    <form action="https://httpbin.org/post" method="post">
        <label for="name">Ім'я</label>
        <input type="text" id="name" name="name" required>
        <br><br>
        <label for="email">Електронна пошта</label>
        <input type="email" id="email" name="email" required>
        <br><br>
        <label for="subject">Тема звернення</label>
        <select id="subject" name="subject">
            <option value="question">Запитання</option>
            <option value="suggestion">Пропозиція</option>
            <option value="error">Повідомлення про помилку на сайті</option>
        </select>
        <br><br>
        <label for="message">Текст повідомлення</label><br>
        <textarea id="message" name="message" rows="5" minlength="10" required></textarea>
        <br><br>
        <div class="checkbox">
        <input type="checkbox" name="consent" required>
        <label for="consent">Погождуюсь на обробку персональних даних</label>
        </div>
        <br><br>
        <button type="submit">Надіслати</button>
    </form>
    </fieldset>
